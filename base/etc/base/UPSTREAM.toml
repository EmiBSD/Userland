# The pin of an inherited program (docs/PROGRAM.md). tools/upstream.py fetches and verifies it.
[upstream]
name    = "etc/base"
kind    = "git"
repo    = "https://github.com/EmiBSD/OpenBSD-src"           # the organisation's mirror, always
origin  = "https://github.com/openbsd/src"          # what the mirror is fed from
path    = ["etc/master.passwd", "etc/group", "etc/shells", "etc/services", "etc/protocols", "etc/rpc", "etc/MAKEDEV.mi", "etc/MAKEDEV.common", "etc/MAKEDEV.sub", "etc/MAKEDEV.man", "etc/MAKEDEV.mansub", "etc/mtree", "etc/skel", "etc/root", "etc/motd", "etc/minfree", "etc/etc.arm64", "etc/etc.amd64", "etc/Makefile", "etc/Makefile.inc", "etc/amd", "etc/crontab", "etc/examples", "etc/fbtab.head", "etc/fbtab.tail", "etc/ftpusers", "etc/ksh.kshrc", "etc/locate.rc", "etc/mail", "etc/mailer.conf", "etc/moduli", "etc/newsyslog.conf", "etc/nsd.conf", "etc/ntpd.conf", "etc/pf.conf", "etc/pf.os", "etc/ppp", "etc/rpki", "etc/signify", "etc/syslog.conf", "etc/unbound.conf"]
commit  = "3ce1f3f79392ae4d60ce67bea5835d517caaa2ca"
version = ""                 # the human version; to fill from the source when empty
license = []   # the families; the texts stay in the source

[security]
cpe     = ""            # NVD product, for tools/cve.py

[patches]
series  = []   # patches/NNNN-*.patch, in order; each with its reason
