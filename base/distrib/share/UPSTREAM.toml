# The pin of an inherited program (docs/PROGRAM.md). tools/upstream.py fetches and verifies it.
[upstream]
name    = "distrib/share"
kind    = "git"
repo    = "https://github.com/EmiBSD/OpenBSD-src"           # the organisation's mirror, always
origin  = "https://github.com/openbsd/src"          # what the mirror is fed from
path    = ["share/mk", "share/man", "share/btrace", "share/snmp", "share/tmac", "share/Makefile", "share/Makefile.inc"]
commit  = "3ce1f3f79392ae4d60ce67bea5835d517caaa2ca"
version = ""                 # the human version; to fill from the source when empty
license = []   # the families; the texts stay in the source

[security]
cpe     = ""            # NVD product, for tools/cve.py

[patches]
series  = ["0001-makewhatis-by-variable.patch"]   # patches/NNNN-*.patch, in order; each with its reason
