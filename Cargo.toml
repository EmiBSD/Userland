# The workspace. A program's package (src/Cargo.toml) is added to `members` when its STATUS
# reaches `implemented`; until then the skeletons are not built.
[workspace]
resolver = "3"
members = [
    "lib/crates/sys/src",
    "lib/crates/cli/src",
    "bin/files/ls/src",
    "bin/files/cp/src",
]

[workspace.package]
edition = "2024"
license = "ISC"
authors = ["Emilio Navarrete Lineros <enavarre@outlook.com>"]
