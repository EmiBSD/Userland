# The Kernel's release the base system takes the Kernel's part of itself from (the user's
# decisions of 2026-11-05 and 2026-11-08): the boot loader installboot(8) puts on the disk
# (/usr/mdec/BOOTAA64.EFI), the kernel-ABI headers of /usr/include (include/) and the
# interface inventory the manual is filtered by (MANUAL.toml). tools/upstream.py fetch
# downloads each architecture's artifact by tag into upstream/kernel/<release>/, checks its
# sum and unpacks what `take` names; world.py installs from it: `mdec` in /usr/mdec, include/
# in /usr/include, MANUAL.toml read by the manual step. A new Kernel release is a commit that
# moves this pin, with its reason.
[kernel]
repo    = "https://github.com/EmiBSD/Kernel"
release = "20261108-b99aedaf"                          # the GitHub release (a pre-release)
commit  = ""   # what the tag names
take    = ["BOOTAA64.EFI", "MANUAL.toml", "include"]   # unpacked (include/ keeps its machine -> arm64 link)
mdec    = ["BOOTAA64.EFI"]                             # installed in /usr/mdec, root:bin 555

[kernel.sha256]   # kernel-<release>-<arch>.tar.zst; amd64 joins when the Kernel releases it
arm64 = "cd407fcf4133d9289977269188223900a3950e6a53ea57eae0e4c2d68d7372dc"
